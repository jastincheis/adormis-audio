name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Get Stems' model (Demucs htdemucs by Meta, MIT, converted for demucs.cpp),
# kept in its own repo so the program's release page stays clean.
env:
  MODEL: ggml-model-htdemucs-4s-f16.bin
  MODEL_SHA256: 72b17c42d308982ddb5069bc3bf48b81a5aac4cb6516e4366c0fa7cef6df0064

jobs:
  macos:
    name: "macOS (Universal: Apple Silicon + Intel)"
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        shell: bash
        run: echo "version=$(sed -n 's/^project(AdormisAudio VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"
      - name: Get Stems model
        shell: bash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/$MODEL" "https://github.com/jastincheis/adormis-audio-models/releases/download/htdemucs-4s-f16/$MODEL"
          if command -v sha256sum > /dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          echo "$MODEL_SHA256  $RUNNER_TEMP/$MODEL" | $sum -c -
          p="$RUNNER_TEMP/$MODEL"; command -v cygpath > /dev/null && p=$(cygpath -m "$p")
          echo "MODEL_PATH=$p" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DADORMIS_DEMUCS_MODEL="$MODEL_PATH"
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Package
        run: |
          cd build/AdormisAudio_artefacts/Release
          ditto -c -k --keepParent "Adormis Audio.app" "$GITHUB_WORKSPACE/AdormisAudio-${{ steps.v.outputs.version }}-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: AdormisAudio-macOS
          path: AdormisAudio-${{ steps.v.outputs.version }}-macOS.zip

  linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { arch: x86_64,  runner: ubuntu-24.04 }
          - { arch: arm64,   runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        shell: bash
        run: echo "version=$(sed -n 's/^project(AdormisAudio VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libcurl4-openssl-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libxi-dev libgl1-mesa-dev libmp3lame-dev libsamplerate0-dev
      - name: Get Stems model
        shell: bash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/$MODEL" "https://github.com/jastincheis/adormis-audio-models/releases/download/htdemucs-4s-f16/$MODEL"
          if command -v sha256sum > /dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          echo "$MODEL_SHA256  $RUNNER_TEMP/$MODEL" | $sum -c -
          p="$RUNNER_TEMP/$MODEL"; command -v cygpath > /dev/null && p=$(cygpath -m "$p")
          echo "MODEL_PATH=$p" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DADORMIS_DEMUCS_MODEL="$MODEL_PATH"
      - name: Build
        run: cmake --build build -j 4
      - name: Package
        run: tar -C build/AdormisAudio_artefacts/Release -czf AdormisAudio-${{ steps.v.outputs.version }}-Linux-${{ matrix.arch }}.tar.gz "Adormis Audio" models
      - uses: actions/upload-artifact@v4
        with:
          name: AdormisAudio-Linux-${{ matrix.arch }}
          path: AdormisAudio-${{ steps.v.outputs.version }}-Linux-${{ matrix.arch }}.tar.gz

  windows:
    name: Windows (x64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        shell: bash
        run: echo "version=$(sed -n 's/^project(AdormisAudio VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"
      - name: Get Stems model
        shell: bash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/$MODEL" "https://github.com/jastincheis/adormis-audio-models/releases/download/htdemucs-4s-f16/$MODEL"
          if command -v sha256sum > /dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          echo "$MODEL_SHA256  $RUNNER_TEMP/$MODEL" | $sum -c -
          p="$RUNNER_TEMP/$MODEL"; command -v cygpath > /dev/null && p=$(cygpath -m "$p")
          echo "MODEL_PATH=$p" >> "$GITHUB_ENV"
      - name: Configure
        shell: bash
        run: cmake -S . -B build -DADORMIS_DEMUCS_MODEL="$MODEL_PATH"
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Package
        run: Compress-Archive -Path 'build/AdormisAudio_artefacts/Release/Adormis Audio.exe','build/AdormisAudio_artefacts/Release/models' -DestinationPath AdormisAudio-${{ steps.v.outputs.version }}-Windows.zip
      - name: Self-test (which menu commands are usable)
        continue-on-error: true
        run: |
          python -c "import wave,struct,math; w=wave.open('test.wav','wb'); w.setnchannels(2); w.setsampwidth(2); w.setframerate(44100); w.writeframes(b''.join(struct.pack('<hh',int(8000*math.sin(i/20)),int(8000*math.sin(i/20))) for i in range(88200))); w.close()"
          $p = Start-Process -FilePath 'build/AdormisAudio_artefacts/Release/Adormis Audio.exe' -ArgumentList '--list-commands','commands-windows.txt','test.wav' -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "Adormis Audio did not quit" }
          Get-Content commands-windows.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commands-windows
          path: commands-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AdormisAudio-Windows
          path: AdormisAudio-${{ steps.v.outputs.version }}-Windows.zip
