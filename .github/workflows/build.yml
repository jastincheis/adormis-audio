name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: "macOS (Universal: Apple Silicon + Intel)"
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Package
        run: |
          cd build/WaveForge_artefacts/Release
          ditto -c -k --keepParent WaveForge.app "$GITHUB_WORKSPACE/WaveForge-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: WaveForge-macOS
          path: WaveForge-macOS.zip

  linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { arch: x86_64,  runner: ubuntu-24.04 }
          - { arch: arm64,   runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libxi-dev libgl1-mesa-dev libmp3lame-dev libsamplerate0-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j 4
      - name: Package
        run: tar -C build/WaveForge_artefacts/Release -czf WaveForge-Linux-${{ matrix.arch }}.tar.gz WaveForge
      - uses: actions/upload-artifact@v4
        with:
          name: WaveForge-Linux-${{ matrix.arch }}
          path: WaveForge-Linux-${{ matrix.arch }}.tar.gz

  windows:
    name: Windows (x64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Package
        run: Compress-Archive -Path build/WaveForge_artefacts/Release/WaveForge.exe -DestinationPath WaveForge-Windows.zip
      - name: Self-test (which menu commands are usable)
        continue-on-error: true
        run: |
          python -c "import wave,struct,math; w=wave.open('test.wav','wb'); w.setnchannels(2); w.setsampwidth(2); w.setframerate(44100); w.writeframes(b''.join(struct.pack('<hh',int(8000*math.sin(i/20)),int(8000*math.sin(i/20))) for i in range(88200))); w.close()"
          $p = Start-Process -FilePath build/WaveForge_artefacts/Release/WaveForge.exe -ArgumentList '--list-commands','commands-windows.txt','test.wav' -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "WaveForge did not quit" }
          Get-Content commands-windows.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commands-windows
          path: commands-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WaveForge-Windows
          path: WaveForge-Windows.zip
