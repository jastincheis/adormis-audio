name: Windows UI test

# Runs a WaveForge build on a real Windows desktop and drives it like a user,
# with screenshots. No build here: it takes the Windows zip of a release
# (default: the newest) or of a Build run.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release tag to test (empty = newest release)"
        required: false
      run_id:
        description: "Or: the ID of a Build run to take WaveForge-Windows from"
        required: false

permissions:
  contents: read
  actions: read

jobs:
  ui-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Get WaveForge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ inputs.run_id }}") {
            gh run download ${{ inputs.run_id }} -R ${{ github.repository }} -n WaveForge-Windows -D dl
          } elseif ("${{ inputs.release }}") {
            gh release download "${{ inputs.release }}" -R ${{ github.repository }} -p WaveForge-Windows.zip -D dl
          } else {
            $tag = gh release list -R ${{ github.repository }} -L 1 --json tagName -q '.[0].tagName'
            gh release download $tag -R ${{ github.repository }} -p WaveForge-Windows.zip -D dl
          }
          Expand-Archive dl/WaveForge-Windows.zip -DestinationPath app
          Get-ChildItem app
      - name: Install test tools
        run: python -m pip install --quiet pywinauto pyautogui pillow
      - name: Screen size
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
      - name: Drive WaveForge
        run: python tests/windows_ui_test.py app/WaveForge.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ui-test
          path: |
            shots/
            ui-test-log.txt
            uia-tree.txt
